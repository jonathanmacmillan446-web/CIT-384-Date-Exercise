<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Exercise</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
    }
    .box {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .label {
      font-size: 0.8em;
      text-transform: uppercase;
      color: #777;
    }
    #after {
      font-size: 1.6em;
      font-weight: bold;
      color: #1a6b3c;
    }
  </style>
</head>
<body>
  <h1>Date Exercise</h1>

  <div class="box">
    <p class="label">Before (slide 16)</p>
    <p id="before"></p>
  </div>

  <div class="box">
    <p class="label">After</p>
    <p id="after"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
